name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip -y

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify toolchain
        shell: pwsh
        run: |
          nuget help | Select-Object -First 1
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test test/core

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release -v 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "## Build failed" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Get-Content build.log -Tail 120 | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - name: Zip release bundle
        shell: pwsh
        run: |
          $candidates = @(
            "build\windows\x64\runner\Release",
            "build\windows\runner\Release"
          )
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) {
            throw "Windows Release folder not found"
          }
          Compress-Archive -Path "$src\*" -DestinationPath "video_download_ev1-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video_download_ev1-windows-x64
          path: video_download_ev1-windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ github.run_number }}
          name: Windows v${{ github.run_number }}
          files: video_download_ev1-windows-x64.zip
          generate_release_notes: true
