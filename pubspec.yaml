name: video_download_ev1
description: EV1 video sniffer and downloader for iOS, Android, macOS, and Windows.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_inappwebview: ^6.1.5
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  dio: ^5.7.0
  uuid: ^4.5.1
  share_plus: ^10.1.2
  open_filex: ^4.6.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  intl: ^0.19.0

# sqlite3 3.x 默认从 GitHub 拉预编译库；国内网络常超时。
# 改用 sqlite3_flutter_libs 已链进进程的 SQLite。
hooks:
  user_defines:
    sqlite3:
      source: process

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # flutter_inappwebview / media_kit 不支持 SwiftPM，否则 iOS 会报
  # Module 'flutter_inappwebview_ios' not found。
  config:
    enable-swift-package-manager: false
  assets:
    - assets/injected_sniff.js
    - assets/ev2-decrypt.wasm
    - assets/ev2_convert.mjs
